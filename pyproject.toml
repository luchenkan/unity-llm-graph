[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-llm-graph"
version = "0.6.0"
description = "Unity-aware dependency graph and context engine for LLMs (code + serialized references)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "unity-llm contributors" }]
keywords = ["unity", "llm", "mcp", "code-graph", "prefab", "dependency-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
# 零第三方运行时依赖:只用 Python 标准库,任何 LLM 环境都能直接跑。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
unity-llm = "unity_llm.cli:main"

[tool.setuptools.packages.find]
include = ["unity_llm*"]
